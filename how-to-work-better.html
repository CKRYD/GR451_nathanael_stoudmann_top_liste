<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>How to work better.</title>
	<link rel="stylesheet" href="style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

	<style>

		body{
			font-family: "Jura", sans-serif;
			text-transform: uppercase;
			max-width: 13rem;
			margin:auto;
			color: rgb(251, 145, 69);
			
			background-color: black;
			
		}
		h1{
			margin:2.2rem;
			margin-bottom:4rem;
			margin-top: 5rem;
			font-weight: 100;
			border: 1rem;
			border-color: rgb(61, 143, 214);
			background-color: rgb(251, 145, 69);
			padding: 0.55rem;
			color: rgb(0, 0, 0);
			border-radius: 0.4rem;
			
		
		}

		
		li {
			font-size:1.5rem;
			font-weight: 400;
			margin-bottom:1rem
		}
		span{
			text-align: right;
		}

	</style>


	<h1>How to work better.</h1>
	
	<ol>
		<li>Do one thing at <span>a time</span> </li>
		<li>Know the problem</li>
		<li>Learn to listen</li>
		<li>Learn to ask questions</li>
		<li>Distinguish sense from nonsense</li>
		<li>Accept change as inevitable</li>
		<li>Admit mistakes</li>
		<li>Say it simple</li>
		<li>Be calm</li>
		<li>Smile</li>
	</ol>

</body>
</html>
